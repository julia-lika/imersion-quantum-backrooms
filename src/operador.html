<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Quantum Backrooms — Operador</title>
    <script>
      // O operador agora joga dentro do lobby: leva para o jogo com ?operador,
      // mantendo as opções de rede (sala, transporte, TURN).
      const params = new URLSearchParams(location.search);
      params.set('operador', '');
      location.replace(`index.html?${params.toString().replace(/operador=(&|$)/, 'operador$1')}`);
    </script>
  </head>
  <body style="background:#060604;color:#d8bc75;font-family:'Courier New',monospace">
    <p>O operador agora fica no lobby do jogo. <a href="index.html?operador" style="color:#ffe69b">Abrir o jogo como operador</a>.</p>
  </body>
</html>
